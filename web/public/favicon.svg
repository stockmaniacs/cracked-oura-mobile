<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#0F0F1A"/>
  <!-- Track ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(76,201,240,0.18)" stroke-width="5"/>
  <!-- Progress arc ~270° in teal, gap at bottom-right -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#4CC9F0" stroke-width="5"
    stroke-dasharray="47.1 15.7"
    stroke-linecap="round"
    transform="rotate(-90 16 16)"/>
  <!-- Small green dot (readiness) -->
  <circle cx="16" cy="6" r="2" fill="#4CAF50"/>
</svg>
